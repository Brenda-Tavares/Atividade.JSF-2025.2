<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Formulário de Contato</title>

<h:outputStylesheet library="_css" name="main.css" />
</head>
<body>
	<!--Formulário-->

	<h:form>
		<h:panelGrid columns="2">

			<h:outputLabel for="nome" value="Nome:" />
			<h:inputText id="nome" styleClass="input-text" />

			<h:outputLabel for="sobrenome" value="Sobrenome:" />
			<h:inputText id="sobrenome" styleClass="input-text" />

			<h:outputLabel for="fone" value="Fone:" />
			<h:inputText id="fone" styleClass="input-text" />

			<h:outputLabel for="email" value="Email:" />
			<h:inputText id="email" styleClass="input-text" />

			<h:commandButton value="Enviar" />

		</h:panelGrid>
	</h:form>

</body>
</html>
